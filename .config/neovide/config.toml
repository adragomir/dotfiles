neovim-bin = "/opt/homebrew/bin/nvim"
frame = "buttonless"
maximized = true
vsync = false
no-multigrid = true
tabs = false
system-native-tabs = false
# system-native-tabs = true
# system-pinned-hotkey = "ctrl+shift+z" # macOS only
# system-switcher-hotkey = "ctrl+shift+n" # macOS only, requires macos-native-tabs = true
# system-tab-prev-hotkey = "cmd+shift+[" # macOS only
# system-tab-next-hotkey = "cmd+shift+]" # macOS only
# system-show-all-tabs-hotkey = "cmd+shift+e"
# system-hide-hotkey = ""
# system-hide-others-hotkey = ""
# system-quit-hotkey = "cmd+q"
# system-new-window-hotkey = "cmd+n"
# system-minimize-hotkey = ""
# system-fullscreen-hotkey = ""
title-hidden = true
highlight_matching_pair = true

[font]
normal = "Iosevka Custom"
size = 11
hinting = "full"
edging = "antialias"

[font.features]
"0xProto" = ["-calt", "-liga", "-dlig"]
"Iosevka Custom" = ["-calt", "-liga", "-dlig", "+NWID"]

[box-drawing]
# "font-glyph", "native" or "selected-native"
mode = "font-glyph"
